name: Prettier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # root package.json requires npm 12 via devEngines
      - run: npm install -g npm@12.0.2

      - run: npm ci

      - run: npm run format:check
